apps:
  - name: edunihongo-api

    # Lokasi project
    cwd: /var/www/html/EduNihongo/backend

    # Jalankan npm
    script: npm
    args: run dev
    interpreter: none

    # Mode PM2
    exec_mode: fork
    instances: 1

    # Restart otomatis jika crash
    autorestart: true
    watch: true
    max_restarts: 10
    restart_delay: 5000

    # Environment
    env:
      NODE_ENV: development
      PORT: 5001

    # Log
    out_file: /var/log/pm2/edunihongo-api-out.log
    error_file: /var/log/pm2/edunihongo-api-error.log
    merge_logs: true
    time: true