<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduNihongo - GraphQL Explorer & IDE</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #0f172a;
      color: #f8fafc;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      background: #8f0020;
      color: #ffffff;
      font-weight: 900;
      font-size: 16px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 4px rgba(143, 0, 32, 0.4);
    }
    .title-group h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    .title-group p {
      margin: 0;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #475569;
      color: #ffffff;
    }
    .btn-primary {
      background: #8f0020;
      border-color: #a30024;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #b00027;
    }
    #graphiql {
      flex: 1;
      height: calc(100vh - 55px);
      width: 100%;
    }
  </style>

  <!-- React & ReactDOM (CDNs with fallback) -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- GraphiQL Bundle -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/graphiql@3.0.6/graphiql.min.css" />
  <script crossorigin src="https://cdn.jsdelivr.net/npm/graphiql@3.0.6/graphiql.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">漢</div>
      <div class="title-group">
        <h1>EduNihongo GraphQL Explorer</h1>
        <p>Interactive GraphiQL IDE & Semantic Graph API Endpoint</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="loadSampleKyuu()">Query Kanji 究</button>
      <button class="btn" onclick="loadSampleKen()">Query Kanji 研</button>
      <a href="/docs" target="_blank" class="btn">REST Swagger Docs ↗</a>
    </div>
  </header>

  <div id="graphiql">Loading EduNihongo GraphiQL IDE...</div>

  <script>
    const sampleQueryKyuu = `query {
  getKanjiSemanticGraph(character: "究") {
    targetKanji {
      word
      meaning
      romaji
      onyomi
      kunyomi
    }
    nodes {
      id
      label
      type
    }
    edges {
      source
      target
      predicate
    }
  }
}`;

    const sampleQueryKen = `query {
  getKanjiSemanticGraph(character: "研") {
    targetKanji {
      word
      meaning
      romaji
      onyomi
      kunyomi
    }
    nodes {
      id
      label
      type
    }
    edges {
      source
      target
      predicate
    }
  }
}`;

    const fetcher = GraphiQL.createFetcher({ url: '/graphql' });
    const container = document.getElementById('graphiql');
    const root = ReactDOM.createRoot(container);

    function renderIDE(queryStr) {
      root.render(
        React.createElement(GraphiQL, {
          fetcher: fetcher,
          defaultQuery: queryStr || sampleQueryKyuu,
          isHeadersEditorDisplayed: true,
        })
      );
    }

    renderIDE(sampleQueryKyuu);

    function loadSampleKyuu() {
      renderIDE(sampleQueryKyuu);
    }

    function loadSampleKen() {
      renderIDE(sampleQueryKen);
    }
  </script>
</body>
</html>
